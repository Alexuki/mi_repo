name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Pasar el linter
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Generar la documentación
        run: npm run docs

      - name: Subir la documentación como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: documentacion
          path: docs/api
